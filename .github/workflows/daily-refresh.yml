name: Daily Refresh

on:
  schedule:
    # 11:00 UTC = 6:00 AM CDT / 5:00 AM CST
    # GitHub Actions cron is UTC only; does not observe DST.
    - cron: '0 11 * * *'
  workflow_dispatch:
    inputs:
      county:
        description: 'County to scrape. "all" runs the full daily pipeline. A single county-id (e.g. cuyahoga-oh) runs ONLY that county scraper for fast testing.'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - miami-dade-fl
          - broward-fl
          - duval-fl
          - lee-fl
          - orange-fl
          - cuyahoga-oh
          - franklin-oh
          - montgomery-oh
          - summit-oh
          - hamilton-oh
      run_dockets:
        description: 'Run docket enrichment step (slow). Off for quick auction-scraper tests.'
        required: false
        default: true
        type: boolean
      run_pr:
        description: 'Run PropertyRadar enrichment step (slow). Off for quick tests.'
        required: false
        default: true
        type: boolean
      docket_county:
        description: 'Docket scraper(s) to run when run_dockets is on. "auto" = all working docket counties in parallel (cuyahoga-oh, montgomery-oh, summit-oh, miami-dade-fl, duval-fl). A single county-id (e.g. summit-oh) runs ONLY that county. A comma-separated list runs those specific counties. NOTE: broward-fl is LOCAL-RUN (Turnstile, residential-IP only) and is skipped by the cron — run it with `python -m core.dockets.broward`.'
        required: false
        default: 'auto'
        type: string
      commit_results:
        description: 'Commit and push refreshed data. Off for test runs so the trail stays clean.'
        required: false
        default: true
        type: boolean
      health_drill:
        description: 'DRILL: after the real data-health evaluation, force a CRITICAL verdict (exit 2). Proves the publish-then-fail ordering and the auto-issue path on a real run. Data + health.json stay real.'
        required: false
        default: false
        type: boolean
      pr_probe_address:
        description: 'PR API smoke test address (Purchase=0, free). Pipe-separated STREET|CITY|STATE|ZIP. When set, skips lead enrichment and runs only the probe.'
        required: false
        default: ''
        type: string
      pr_probe_criteria:
        description: 'PR API smoke test with raw Criteria JSON (Purchase=0, free). JSON array, e.g. [{"name":"APN","value":["6822178"]}]. When set, skips lead enrichment.'
        required: false
        default: ''
        type: string
      pr_probe_radarid:
        description: 'PR API smoke test: GET /v1/properties/{RadarID}. Free (no exports deducted). Use P8A0E18D for the docs sample. When set, skips lead enrichment.'
        required: false
        default: ''
        type: string
      pr_probe_chain:
        description: 'PR API end-to-end chain probe (Purchase=0). Pipe-separated STREET|CITY|STATE|ZIP. Runs suggestions → POST /properties → GET /properties/{RadarID} in one shot.'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  issues: write     # data-health auto-issue (de-duped, GITHUB_TOKEN)

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ── TEST GATE ──────────────────────────────────────────────────────
      # All 8 suites run against COMMITTED captured data (network-free,
      # <10s). No continue-on-error: a red suite stops the job here —
      # no scrape, no publish. A broken build must never reach the live
      # dashboard. Runs before the Playwright browser install so a failure
      # aborts before any expensive step.
      - name: Test gate — all suites must pass before scrape/publish
        run: |
          python -m tests.test_verification
          python -m tests.test_miami_dade_docket
          python -m tests.test_broward_docket
          python -m tests.test_hamilton_docket
          python -m tests.test_duval_docket
          python -m tests.test_lee_liens
          python -m tests.test_summit_debt
          python -m tests.test_cuyahoga_debt
          python -m tests.test_montgomery_debt
          python -m tests.test_franklin_docket
          python -m tests.test_appraised_sanity
          python -m tests.test_bankruptcy_guard
          python -m tests.test_fl_county_court
          python -m tests.test_fl_tax_deed
          python -m tests.test_miami_dade_taxdeed
          python -m tests.test_orange_registry
          python -m tests.test_health

      - name: Install Playwright Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Install xvfb for headed-mode CAPTCHA counties
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Resolve run parameters
        id: params
        run: |
          # Scheduled runs (no inputs) always behave as the full daily pipeline.
          COUNTY="${{ github.event.inputs.county }}"
          RUN_DOCKETS="${{ github.event.inputs.run_dockets }}"
          RUN_PR="${{ github.event.inputs.run_pr }}"
          DOCKET_COUNTY="${{ github.event.inputs.docket_county }}"
          COMMIT="${{ github.event.inputs.commit_results }}"
          DRILL="${{ github.event.inputs.health_drill }}"

          # Empty inputs => scheduled run => full pipeline defaults.
          [ -z "$COUNTY" ]        && COUNTY="all"
          [ -z "$RUN_DOCKETS" ]   && RUN_DOCKETS="true"
          [ -z "$RUN_PR" ]        && RUN_PR="true"
          [ -z "$DOCKET_COUNTY" ] && DOCKET_COUNTY="auto"
          [ -z "$COMMIT" ]        && COMMIT="true"
          [ -z "$DRILL" ]         && DRILL="false"

          # docket_county "auto" resolves to "all_working", the literal value
          # that core/dockets/enrich.py expands to every verified scraper
          # (cuyahoga-oh, montgomery-oh, summit-oh) and runs them in parallel
          # via run_counties_parallel(). A single county-id still runs serially.
          [ "$DOCKET_COUNTY" = "auto" ] && DOCKET_COUNTY="all_working"

          echo "county=$COUNTY"               >> "$GITHUB_OUTPUT"
          echo "run_dockets=$RUN_DOCKETS"      >> "$GITHUB_OUTPUT"
          echo "run_pr=$RUN_PR"                >> "$GITHUB_OUTPUT"
          echo "docket_county=$DOCKET_COUNTY"  >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT"                >> "$GITHUB_OUTPUT"
          echo "health_drill=$DRILL"           >> "$GITHUB_OUTPUT"
          # The data-health gate scores a MISSING cron docket file as a run that
          # wrote nothing ONLY on the full daily pipeline (county=all + dockets).
          if [ "$COUNTY" = "all" ] && [ "$RUN_DOCKETS" = "true" ]; then
            echo "health_cron_day=1" >> "$GITHUB_OUTPUT"
          else
            echo "health_cron_day=" >> "$GITHUB_OUTPUT"
          fi

          echo "===== RESOLVED RUN PARAMETERS ====="
          echo "  county scrape target : $COUNTY"
          echo "  run docket step      : $RUN_DOCKETS (county: $DOCKET_COUNTY)"
          echo "  run PR step          : $RUN_PR"
          echo "  commit results       : $COMMIT"
          echo "  health drill         : $DRILL"

      - name: Run auction scrapers
        id: scrapers
        if: github.event.inputs.pr_probe_address == '' && github.event.inputs.pr_probe_criteria == '' && github.event.inputs.pr_probe_radarid == '' && github.event.inputs.pr_probe_chain == ''
        run: |
          # No --days flag: scrape depth comes from config.counties.LEAD_WINDOW_DAYS,
          # the single source of truth shared with the loader/dashboard display
          # window. Passing an explicit --days here would let the two drift again.
          if [ "${{ steps.params.outputs.county }}" = "all" ]; then
            echo "Running ALL 10 counties (window: config.counties.LEAD_WINDOW_DAYS)"
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
              python -m core.auction.universal --all
          else
            echo "Running SINGLE county: ${{ steps.params.outputs.county }} (window: config.counties.LEAD_WINDOW_DAYS)"
            xvfb-run -a --server-args="-screen 0 1280x800x24" \
              python -m core.auction.universal "${{ steps.params.outputs.county }}"
          fi
        continue-on-error: false

      - name: Run docket enrichment
        id: dockets
        if: steps.params.outputs.run_dockets == 'true' && github.event.inputs.pr_probe_address == '' && github.event.inputs.pr_probe_criteria == '' && github.event.inputs.pr_probe_radarid == '' && github.event.inputs.pr_probe_chain == ''
        run: |
          echo "Running docket enrichment for: ${{ steps.params.outputs.docket_county }}"
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            python -m core.dockets.enrich "${{ steps.params.outputs.docket_county }}"
        continue-on-error: true

      # Miami-Dade tax-deed CLAIM-STATUS layer (RealTDM). Open portal, cloud-
      # runnable (no CAPTCHA/Cloudflare). Runs on the full-pipeline path only.
      # Kills dead tax-deed leads + confirms/surfaces the clerk pool when a
      # Surplus Letter is posted. Never local-run; never computes owner-net.
      - name: Run Miami-Dade tax-deed claim-status (RealTDM)
        id: taxdeed
        if: steps.params.outputs.run_dockets == 'true' && steps.params.outputs.county == 'all' && github.event.inputs.pr_probe_address == '' && github.event.inputs.pr_probe_criteria == '' && github.event.inputs.pr_probe_radarid == '' && github.event.inputs.pr_probe_chain == ''
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            python -m core.dockets.miami_dade_taxdeed
        continue-on-error: true

      # Orange (FL) Court Registry Balance — CLOUD verification. The registry
      # page's invisible reCAPTCHA v2 PASSES SILENTLY from the Actions datacenter
      # IP (proven), so unlike the Orange docket PORTAL (per-search reCAPTCHA,
      # local-run only) this rides the cron. Lifecycle-staged by balance-vs-bid:
      # no-registry KILLS, a distributed CA balance confirms the owner surplus, CC
      # surfaces real-but-clouded held funds, pending stays apparent. FAILS LOUD —
      # a challenge/timeout leaves the lead registry-not-checked, never fabricated.
      # If the county-health warning trips (challenges appear), flip the transport
      # in core/dockets/orange_registry.py to the residential bridge-extension.
      - name: Run Orange Court Registry Balance lookup
        id: orange_registry
        if: steps.params.outputs.run_dockets == 'true' && steps.params.outputs.county == 'all' && github.event.inputs.pr_probe_address == '' && github.event.inputs.pr_probe_criteria == '' && github.event.inputs.pr_probe_radarid == '' && github.event.inputs.pr_probe_chain == ''
        run: |
          xvfb-run -a --server-args="-screen 0 1280x800x24" \
            python -m core.dockets.orange_registry
        continue-on-error: true

      - name: PR API probe (Purchase=0, free)
        id: pr_probe
        if: github.event.inputs.pr_probe_address != '' || github.event.inputs.pr_probe_criteria != '' || github.event.inputs.pr_probe_radarid != '' || github.event.inputs.pr_probe_chain != ''
        env:
          PROPERTYRADAR_TOKEN: ${{ secrets.PROPERTYRADAR_TOKEN }}
          PR_PROBE_ADDRESS: ${{ github.event.inputs.pr_probe_address }}
          PR_PROBE_CRITERIA: ${{ github.event.inputs.pr_probe_criteria }}
          PR_PROBE_RADARID: ${{ github.event.inputs.pr_probe_radarid }}
          PR_PROBE_CHAIN: ${{ github.event.inputs.pr_probe_chain }}
        run: |
          if [ -n "$PR_PROBE_CHAIN" ]; then
            python -m core.enrichment.propertyradar --probe-chain "$PR_PROBE_CHAIN"
          elif [ -n "$PR_PROBE_RADARID" ]; then
            python -m core.enrichment.propertyradar --probe-radarid "$PR_PROBE_RADARID"
          elif [ -n "$PR_PROBE_CRITERIA" ]; then
            python -m core.enrichment.propertyradar --probe-criteria "$PR_PROBE_CRITERIA"
          else
            python -m core.enrichment.propertyradar --probe-address "$PR_PROBE_ADDRESS"
          fi
        continue-on-error: false

      - name: Run PropertyRadar enrichment
        id: pr_enrich
        if: steps.params.outputs.run_pr == 'true' && github.event.inputs.pr_probe_address == '' && github.event.inputs.pr_probe_criteria == '' && github.event.inputs.pr_probe_radarid == '' && github.event.inputs.pr_probe_chain == ''
        timeout-minutes: 10
        env:
          PROPERTYRADAR_TOKEN: ${{ secrets.PROPERTYRADAR_TOKEN }}
        run: |
          # Cap at 50 leads/day to bound cost at ~$0.50/day worst case.
          # `yes |` auto-confirms the interactive "Continue? (y/N)" prompt.
          yes | python -m core.enrichment.propertyradar --top 50 || echo "::warning::PR enrichment step had issues — continuing with existing enriched data"
        continue-on-error: true

      - name: Upload docket diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: docket-diagnostics-${{ steps.params.outputs.docket_county }}
          path: data/diagnostics/
          if-no-files-found: ignore
          retention-days: 7

      - name: Regenerate dashboard data
        id: dashboard
        env:
          HEALTH_CRON_DAY: ${{ steps.params.outputs.health_cron_day }}
        run: |
          python -m core.dashboard_data
        continue-on-error: false

      # ── DATA HEALTH GATE (core.health) ──────────────────────────────────
      # Silent-degradation monitor: per county, rows with REAL parsed content
      # vs the county's own trailing baseline (the Broward 2026-08-08 shape —
      # rows present, content gone — is what this catches). Runs AFTER the
      # dashboard regen (so health.json + history.jsonl are part of the
      # publish) and BEFORE the commit. continue-on-error keeps the job alive
      # so the HEALTHY counties still publish; the final step below then
      # fails the run red on CRITICAL. Exit 2 = CRITICAL, 0 = OK/WARN.
      # Full-pipeline path only — a partial run must not pollute the baseline.
      - name: Data health gate (silent-degradation monitor)
        id: health
        if: steps.params.outputs.health_cron_day == '1' && github.event.inputs.pr_probe_address == '' && github.event.inputs.pr_probe_criteria == '' && github.event.inputs.pr_probe_radarid == '' && github.event.inputs.pr_probe_chain == ''
        env:
          HEALTH_CRON_DAY: '1'
        continue-on-error: true
        run: |
          if [ "${{ steps.params.outputs.health_drill }}" = "true" ]; then
            python -m core.health --drill
          else
            python -m core.health
          fi

      # MUST run AFTER dashboard regen — otherwise this artifact captures
      # the git-committed (stale) docs/data/* files, not the freshly built
      # ones. The PR enrichment files in data/enriched/ exist either way,
      # but docs/data/leads.json + summary.json only update during the
      # dashboard step above.
      - name: Upload enriched data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: enriched-data
          path: |
            data/enriched/
            data/dockets/
            data/raw/
            docs/data/
          if-no-files-found: ignore
          retention-days: 7

      - name: Show what changed
        run: |
          echo "===== git status ====="
          git status
          echo "===== docs/data diff summary ====="
          git diff --stat docs/data/ data/ || true

      - name: Commit and push refreshed data
        if: steps.params.outputs.commit == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data/ data/dockets/ data/enriched/ data/raw/ data/health/ 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          BRANCH="${GITHUB_REF#refs/heads/}"
          DATESTAMP=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          git commit -m "Daily refresh ${DATESTAMP}"

          # Race guard: another commit may have landed on origin during
          # the ~10-15 min scrape window. Without rebase, the push gets
          # rejected (non-fast-forward) — this killed run 26537993773.
          # Retry up to 3 times with pull --rebase between attempts.
          for attempt in 1 2 3; do
            if git push origin HEAD:"${BRANCH}"; then
              echo "Push succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "::warning::Push attempt ${attempt} rejected — pulling --rebase and retrying"
            if ! git pull --rebase origin "${BRANCH}"; then
              echo "::error::pull --rebase failed on attempt ${attempt}"
              exit 1
            fi
          done
          echo "::error::Push failed after 3 attempts (persistent rebase race or auth issue)"
          exit 1

      - name: Skipped commit notice
        if: steps.params.outputs.commit != 'true'
        run: |
          echo "::notice::commit_results was false — this was a TEST run. No data committed."

      # ── OUT-OF-BAND SURFACES (the failure mode is "nobody is looking") ──
      # 1. De-duped auto-issue: stable title; an open one gets a comment, not
      #    a duplicate. Runs after the commit so the issue links published data.
      - name: Auto-issue on CRITICAL data health (de-duped)
        if: steps.health.outcome == 'failure' && steps.params.outputs.commit == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          TITLE="[data-health] CRITICAL: docket layer degraded"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          CRIT="${{ steps.health.outputs.critical }}"
          WARN="${{ steps.health.outputs.warn }}"
          DRILL="${{ steps.health.outputs.drill }}"
          STAMP=$(date -u +'%Y-%m-%d %H:%M UTC')
          BODY="**Data health gate: CRITICAL** — ${STAMP}"$'\n\n'
          [ "$DRILL" = "true" ] && BODY="${BODY}> DRILL run (\`health_drill=true\`): the verdict was forced to prove the alerting path. The published health.json is real."$'\n\n'
          BODY="${BODY}- CRITICAL counties: \`${CRIT:-none}\`"$'\n'
          BODY="${BODY}- WARN counties: \`${WARN:-none}\`"$'\n'
          BODY="${BODY}- Run: ${RUN_URL} (see the *Data health gate* step summary for per-source metrics)"$'\n'
          BODY="${BODY}- Live: https://xcerebroai.github.io/surplusiq/ · \`docs/data/health.json\` · \`data/health/history.jsonl\`"$'\n\n'
          BODY="${BODY}Healthy counties were published before this verdict; the affected counties' leads render docket-not-verified. Investigate the docket scraper for the listed counties (\`gh run view ${{ github.run_id }} --log\`), then close this issue once a green run publishes."
          gh label create data-health --color B60205 --description "core.health CRITICAL verdict" 2>/dev/null || true
          EXISTING=$(gh issue list --state open --label data-health --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Open issue #$EXISTING exists — adding a comment (no duplicate)."
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label data-health --body "$BODY"
          fi

      # 2. healthchecks.io dead-man's-switch: pinged ONLY on a clean publish
      #    (commit succeeded AND health overall == OK). A red/degraded run
      #    withholds the ping so the check fires on its own. No-op when the
      #    HEALTHCHECKS_URL secret is absent.
      - name: healthchecks.io ping (clean publish only)
        if: steps.params.outputs.commit == 'true' && steps.health.outcome == 'success' && steps.health.outputs.overall == 'OK'
        env:
          HEALTHCHECKS_URL: ${{ secrets.HEALTHCHECKS_URL }}
        run: |
          if [ -z "$HEALTHCHECKS_URL" ]; then
            echo "HEALTHCHECKS_URL secret not set — dead-man's-switch ping skipped (no-op)."
            exit 0
          fi
          curl -fsS -m 10 --retry 3 "$HEALTHCHECKS_URL" > /dev/null && echo "healthchecks.io pinged."

      # 3. Run-failure backstop: everything above already ran (healthy counties
      #    published, issue filed). Now make the scheduled run red.
      - name: Fail the run on CRITICAL data health (data already published)
        if: steps.health.outcome == 'failure'
        run: |
          echo "::error::Data health gate returned CRITICAL (${{ steps.health.outputs.critical }}). Healthy counties were published above; this run is red on purpose."
          exit 1

      - name: Report failure summary
        if: failure()
        run: |
          echo "::error::Daily refresh failed. Check the step logs above."
          echo "Scraper step outcome:    ${{ steps.scrapers.outcome }}"
          echo "Docket step outcome:     ${{ steps.dockets.outcome }}"
          echo "PR enrich step outcome:  ${{ steps.pr_enrich.outcome }}"
          echo "Dashboard step outcome:  ${{ steps.dashboard.outcome }}"
          echo "Health gate outcome:     ${{ steps.health.outcome }} (overall=${{ steps.health.outputs.overall }})"
