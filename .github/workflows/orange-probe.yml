name: Orange Registry reCAPTCHA Probe

# THROWAWAY. Does the invisible reCAPTCHA v2 on RegistryBalance/Index pass
# silently from the GitHub Actions datacenter IP, or challenge? Reads no data
# beyond a single public balance lookup. Delete after the question is answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - run: |
          sudo apt-get update && sudo apt-get install -y xvfb
      - name: Probe — HEADLESS (datacenter IP)
        env:
          PROBE_HEADLESS: '1'
        run: python -m scripts.orange_registry_ci_probe
        continue-on-error: true
      - name: Probe — HEADED under xvfb (datacenter IP)
        env:
          PROBE_HEADLESS: '0'
        run: |
          xvfb-run -a --server-args="-screen 0 1400x900x24" \
            python -m scripts.orange_registry_ci_probe
        continue-on-error: true
