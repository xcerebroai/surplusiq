name: Tests

# Runs the full acceptance-test battery on every push to main (and on demand).
# The same 8 suites also gate the Daily Refresh workflow before scrape/publish.
# All suites are network-free — they run the exact production logic against
# committed real captured data (data/samples/**), so this is fast (<1 min
# including setup) and deterministic.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: pip install -r requirements.txt
      - name: Run all test suites
        run: |
          python -m tests.test_verification
          python -m tests.test_miami_dade_docket
          python -m tests.test_broward_docket
          python -m tests.test_duval_docket
          python -m tests.test_lee_liens
          python -m tests.test_summit_debt
          python -m tests.test_cuyahoga_debt
          python -m tests.test_montgomery_debt
          python -m tests.test_franklin_docket
          python -m tests.test_appraised_sanity
          python -m tests.test_bankruptcy_guard
          python -m tests.test_fl_county_court
          python -m tests.test_fl_tax_deed
