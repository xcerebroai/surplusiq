name: Broward Turnstile Probe

# THROWAWAY (Phase 1). Answers one question: does the Broward Turnstile token
# auto-issue from the GitHub Actions datacenter IP — headless and/or headed?
# Reads no case data. Delete after the question is answered.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: python -m playwright install --with-deps chromium

      - name: Install xvfb (for headed attempt)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb

      - name: Probe — HEADLESS (datacenter IP)
        env:
          PROBE_HEADLESS: '1'
        run: python -m scripts.broward_ci_probe
        continue-on-error: true

      - name: Probe — HEADED under xvfb (datacenter IP)
        env:
          PROBE_HEADLESS: '0'
        run: |
          xvfb-run -a --server-args="-screen 0 1400x900x24" \
            python -m scripts.broward_ci_probe
        continue-on-error: true
